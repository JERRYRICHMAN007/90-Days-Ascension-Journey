# Free hosting for Aether API (UI stays on Vercel)
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: aether
    runtime: node
    plan: free
    region: oregon
    # Important: do NOT set NODE_ENV=production as a service env var (breaks npm install).
    # Build skips broken `tsc` — prisma generate only; runtime uses tsx.
    buildCommand: npm install --include=dev && npm run build -w server
    startCommand: npm exec -w server -- prisma migrate deploy && NODE_ENV=production npm run start -w server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
