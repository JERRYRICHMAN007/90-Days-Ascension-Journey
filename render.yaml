# Free hosting for Aether API (UI stays on Vercel)
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: aether
    runtime: node
    plan: free
    region: oregon
    # Do NOT set NODE_ENV=production as a service env var (breaks npm install).
    # Rebuild sharp for linux-x64 so native binaries match Render's OS.
    buildCommand: npm install --include=dev --include=optional && npm install --os=linux --cpu=x64 sharp -w server && npm run build -w server
    startCommand: npm exec -w server -- prisma migrate deploy && NODE_ENV=production npm run start -w server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
