# Free hosting for Aether (frontend + API on one URL)
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: aether
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build -w client && npm run build -w server && npm exec -w server -- prisma generate
    startCommand: npm exec -w server -- prisma migrate deploy && npm run start:prod -w server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
