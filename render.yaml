# Free hosting for Aether (frontend + API on one URL)
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: aether
    runtime: node
    plan: free
    region: oregon
    # Do NOT set NODE_ENV=production for the whole service — npm then skips
    # vite/typescript/prisma (devDependencies) and the build fails.
    buildCommand: npm install --include=dev && npm exec -w server -- prisma generate && npm run build -w client && npm run build -w server
    startCommand: npm exec -w server -- prisma migrate deploy && NODE_ENV=production npm run start -w server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
