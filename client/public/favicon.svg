        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="32" height="32" rx="8" fill="#0a0a0a"/>
  <text
    x="16"
    y="23"
    text-anchor="middle"
    font-family="Inter, system-ui, sans-serif"
    font-size="22"
    font-weight="900"
    fill="#00ff87"
    filter="url(#glow)"
  >F</text>
