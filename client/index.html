<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/aether-icon.svg" />
    <link rel="apple-touch-icon" href="/aether-icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Aether — Master Dashboard</title>
    <meta name="description" content="Aether — your 6-month transformation platform for fitness, brand, reading, writing, and software engineering." />
    <script>
      (function () {
        try {
          var key = 'aetherTheme';
          var saved = localStorage.getItem(key);
          var theme = saved || 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          if (theme !== 'light') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
